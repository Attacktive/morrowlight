name: 'Android'

on:
  push:
    branches: ['main', 'feat/morrowlight']
  pull_request:
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@v7.0.1'
        with:
          persist-credentials: false
      - uses: 'actions/setup-java@v6.1.0'
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: 'gradle/actions/setup-gradle@v6.4.0'
        with:
          gradle-version: '9.7.0'
      - name: 'Set up Android SDK command-line tools'
        uses: 'android-actions/setup-android@v4.0.4'
        with:
          packages: 'platform-tools'
      - name: 'Install Android SDK packages'
        run: |
          command -v sdkmanager
          sdkmanager --version
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: 'Build debug APK'
        run: 'gradle --stacktrace :app:assembleDebug'
      - name: 'Verify and name installable APK'
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          cp app/build/outputs/apk/debug/app-debug.apk Morrowlight.apk
      - name: 'Upload APK directly'
        uses: 'actions/upload-artifact@v7.0.2'
        with:
          name: 'Morrowlight-debug-APK'
          path: 'Morrowlight.apk'
          archive: false
          if-no-files-found: 'error'
      - name: 'JVM tests, release shrinker, and lint'
        run: 'gradle --stacktrace :core:test :app:assembleRelease :app:lintDebug'
      - name: 'Upload reports'
        if: 'always()'
        uses: 'actions/upload-artifact@v7.0.2'
        with:
          name: 'verification-reports'
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: 'ignore'
